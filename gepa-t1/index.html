&lt;div class=&quot;wrap&quot;&gt;

  &lt;h1&gt;데이터 생성 기반 APO 카탈로그&lt;/h1&gt;
  &lt;p class=&quot;lede&quot;&gt;합성·자기생성·적대적 데이터로 프롬프트·시연·스킬을 최적화하는 연구(A)와, 데이터 생성 파이프라인(B), 자기생성 데이터로 가중치를 학습하는 인접 연구(C)를 모았습니다. 각 논문마다 초록을 읽고 핵심 아이디어와 키워드를 정리했습니다. &lt;b&gt;APO나 Context Engineering이 아닌 논문도 많으므로&lt;/b&gt;, 각 논문이 실제로 무엇을 최적화하는지 태그로 구분했습니다. &lt;b&gt;기존 문제의 일부만 고쳐 새 문제를 만드는 &quot;기존 문제 변형형&quot;&lt;/b&gt;은 따로 표시하고 별도 탭에 모았습니다. 정리일 2026-10-20.&lt;/p&gt;

  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;기존 문제 변형형이란&lt;/h3&gt;
    &lt;p&gt;처음부터 합성하는 대신 &lt;b&gt;기존 문제(학습 예제·seed·테스트 입력·시연)의 일부만 고쳐&lt;/b&gt; 새 문제를 만드는 기법입니다. data augmentation에 가깝습니다. 아래 10가지 변형 방식으로 나눴고, 한 논문이 여러 방식을 쓰면 모두 표시했습니다.&lt;/p&gt;
    &lt;div class=&quot;tablebox&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;변형 방식&lt;/th&gt;&lt;th&gt;뜻&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;APO·CE&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;그 외&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;opTable&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;APO · Context Engineering 중 변형형 &lt;span class=&quot;note&quot; id=&quot;acCount&quot;&gt;&lt;/span&gt;&lt;/h3&gt;
    &lt;p class=&quot;note&quot;&gt;연구 유형의 주 태그나 보조 태그가 APO·CE인 논문입니다. &quot;변형 데이터 용도&quot;는 만든 변형을 어디에 쓰는지입니다.&lt;/p&gt;
    &lt;div class=&quot;tablebox&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th class=&quot;num&quot;&gt;공개일&lt;/th&gt;&lt;th&gt;논문&lt;/th&gt;&lt;th&gt;연구 유형&lt;/th&gt;&lt;th&gt;변형 방식&lt;/th&gt;&lt;th&gt;변형 데이터 용도&lt;/th&gt;&lt;th&gt;채택·출판&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;acTable&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;GEPA 관점&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;
    &lt;li&gt;&lt;b&gt;최적화에 쓰는 학습(피드백) 셋 자체를 변형으로 늘리는 APO는 4편뿐입니다&lt;/b&gt;: FORGE(실패 사례를 positive·negative·boundary·stress로 변이), CASPER(실패 사례를 본뜬 oversampling), PGO(오타·동의어 등 입력 섭동), RPO(유해 지시문 + 탈옥 접미사). 넷 다 변형을 &lt;b&gt;추가&lt;/b&gt;만 하고 원본을 바꾸지는 않습니다.&lt;/li&gt;
    &lt;li&gt;CE 쪽 변형은 대부분 &lt;b&gt;추론 시점&lt;/b&gt;에 씁니다: 테스트 입력 재서술(DAIL, TATRA, Helix, CodeMetaAgent)이나 시연 생성(Self-ICL, SG-ICL, Self-Demos, Contrastive CoT).&lt;/li&gt;
    &lt;li&gt;변형 방식 표에서 보듯 &lt;b&gt;APO·CE에서 &quot;난이도 하향·힌트&quot;는 0편&lt;/b&gt;이고 값 치환·형식 변환도 1편씩뿐입니다. 가중치 학습 쪽에는 GEPA로 옮겨 볼 만한 연산자가 많습니다: 실패 문제에 힌트·부분 풀이 덧붙이기(QuestA, SEELE, PieceHint), 어려운 문제 단순화(CLPO, Ladders of Thought), 값만 바꾼 동형 문제(AdaR, SvS, QbQ), 의미 보존 재서술(TA-GRPO, MetaMath).&lt;/li&gt;
    &lt;li&gt;평가용 변형 벤치마크(GSM-Plus, GSM-Symbolic, GSM-IC, MATH-Perturb 등)는 GEPA의 Pareto(validation) 셋이 표면 패턴에 과적합했는지 점검하는 용도로 쓸 수 있습니다.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;그 외(비APO) 변형형 &lt;span class=&quot;note&quot; id=&quot;nonCount&quot;&gt;&lt;/span&gt;&lt;/h3&gt;&lt;div id=&quot;nonList&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;panel&quot; id=&quot;tab-keywords&quot; hidden&gt;
  &lt;p class=&quot;note&quot;&gt;키워드를 누르면 논문 목록이 그 키워드로 걸러집니다.&lt;/p&gt;

&lt;/section&gt;
&lt;section class=&quot;panel&quot; id=&quot;tab-about&quot; hidden&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;정리 방법&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;
    &lt;li&gt;기존 데이터 생성 APO 논문들을 시드로 Semantic Scholar 인용·참고 관계와 arXiv 키워드 검색으로 후보 약 5,700편을 모았습니다.&lt;/li&gt;
    &lt;li&gt;제목·초록의 용어(데이터 생성 / 최적화 대상 / 가중치 학습)로 1차 분류하고, 남은 후보를 직접 검토해 포함 여부·단계·유형을 정했습니다. 이미지·음성 등 텍스트 LLM과 무관한 분야는 제외했습니다.&lt;/li&gt;
    &lt;li&gt;핵심 아이디어와 키워드는 각 논문의 초록(방법 설명 문장)을 바탕으로 작성했습니다. 본문 세부와 다를 수 있습니다.&lt;/li&gt;
    &lt;li&gt;채택·출판은 기존 웹 확인 결과 &gt; arXiv comment·journal_ref &gt; Semantic Scholar venue 순으로 판단했습니다. 정보가 없으면 프리프린트로 표기했습니다.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;연구 유형 태그&lt;/b&gt;는 각 논문이 실제로 무엇을 바꾸는지를 기준으로 붙였습니다. 세부 분류(A1~R)를 기본값으로 하고, 핵심 아이디어를 보고 개별 논문을 보정했습니다.&lt;ul&gt;&lt;li&gt;&lt;b&gt;APO&lt;/b&gt;: 프롬프트(지시문·soft prompt)를 최적화&lt;/li&gt;&lt;li&gt;&lt;b&gt;Context Eng.&lt;/b&gt;: 시연·예시·메모리·스킬·harness 등 프롬프트에 들어가는 컨텍스트를 생성·선택·최적화 (가중치 고정)&lt;/li&gt;&lt;li&gt;&lt;b&gt;가중치 학습&lt;/b&gt;: 생성 데이터로 SFT·RL·증류를 해서 모델 파라미터를 갱신&lt;/li&gt;&lt;li&gt;&lt;b&gt;학습 데이터 생성&lt;/b&gt;: 학습용 데이터셋·환경을 만드는 파이프라인이 주 기여&lt;/li&gt;&lt;li&gt;&lt;b&gt;평가·레드팀&lt;/b&gt;: 평가 문항·벤치마크·레드팀 테스트를 생성&lt;/li&gt;&lt;li&gt;&lt;b&gt;분석·서베이&lt;/b&gt;: 이론·실증 분석, 서베이&lt;/li&gt;&lt;/ul&gt;
      주 태그 1개와 보조 태그(있으면 작게 표시)가 있습니다. &quot;생성기용&quot;은 APO·CE를 과제 모델이 아니라 &lt;b&gt;데이터 생성기의 프롬프트·컨텍스트&lt;/b&gt;에 적용했다는 뜻입니다.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;기존 문제 변형형&lt;/b&gt;은 초록·본문에서 변형 대상(기존 예제·seed·입력)과 변형 방식을 확인해 표시했습니다. 기존 382편 중 해당 논문을 고르고, arXiv 키워드 검색(약 580편 후보)과 웹 검색으로 66편을 추가했습니다. 처음부터 합성하는 방식(예: SIPDO는 라벨부터 새로 생성)은 변형형으로 보지 않았습니다.&lt;/li&gt;
    &lt;li&gt;2026-10-20 추가 조사: arXiv 최신순 검색(18개 질의), Hugging Face 일간 논문(최근 100일), GitHub awesome 목록(10개 주제, 약 30개 저장소)에서 후보 3,838편을 모아, 이미 있거나 예전에 제외한 논문을 빼고 약 700편을 검토해 81편을 추가했습니다. 같은 라운드에서 교체형 논문 12편을 교체형 html에 추가했고, 목록의 &quot;교체형 n군&quot; 배지와 필터로 볼 수 있습니다.&lt;/li&gt;
    &lt;li&gt;PDF 링크는 arXiv로 연결됩니다. arXiv에 없는 논문은 PDF 없이 논문 페이지 링크만 있습니다.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; }
header h1 { font-size: 1.75rem; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; text-wrap: balance }
header p.lede { margin: 0; color: var(--muted); max-width: 72ch }
.axes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 18px }
.axis { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; min-width: 0 }
.axis b { font-size: 1.5rem; font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums }
.axis span { color: var(--muted); font-size: 0.86rem }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; color: var(--muted); font-size: 0.86rem }
.stats strong { color: var(--ink); font-family: var(--mono); font-weight: 500 }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 26px 0 14px; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-top: 6px }
nav.tabs button { font: inherit; font-weight: 500; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 8px 12px; cursor: pointer; margin-bottom: -1px }
nav.tabs button[aria-selected=&quot;true&quot;] { color: var(--ink); border-bottom-color: var(--accent) }
nav.tabs button:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
section.panel { display: grid; gap: 14px }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.chip { font: inherit; font-size: 0.86rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer }
.chip[aria-pressed=&quot;true&quot;] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
input[type=&quot;search&quot;], select, input[type=&quot;number&quot;] { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px }
input[type=&quot;search&quot;] { min-width: 0; width: 240px; max-width: 100% }
input[type=&quot;number&quot;] { width: 110px; font-family: var(--mono) }
.note { color: var(--muted); font-size: 0.86rem; max-width: 90ch; margin: 0 }
.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-weight: 600; color: var(--muted); font-size: 0.78rem; letter-spacing: 0.02em; background: var(--soft); position: sticky; top: 0; white-space: nowrap }
th.sortable { cursor: pointer } th.sortable:hover { color: var(--ink) }
tr:last-child td { border-bottom: 0 }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap }
td.mono { font-family: var(--mono); font-size: 0.8rem; word-break: break-all }
a { color: var(--accent); text-decoration: none } a:hover { text-decoration: underline }
.tag { display: inline-block; font-size: 0.74rem; font-weight: 600; border-radius: 4px; padding: 1px 6px; margin: 1px 2px 1px 0; white-space: nowrap }
.T1 { color: var(--t1); background: var(--t1-bg) } .T2 { color: var(--t2); background: var(--t2-bg) } .T3 { color: var(--t3); background: var(--t3-bg) } .F, .G { color: var(--tf); background: var(--tf-bg) }
.pill { display: inline-block; font-size: 0.74rem; font-weight: 600; border-radius: 999px; padding: 1px 8px; white-space: nowrap }
.ok { color: var(--ok); background: var(--ok-bg) } .warn { color: var(--warn); background: var(--warn-bg) } .bad { color: var(--bad); background: var(--bad-bg) } .neutral { color: var(--tf); background: var(--tf-bg) }
.mlist { display: grid; gap: 2px } .mlist div { min-width: 0 }
.bar { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; min-width: 60px }
.bar i { display: block; height: 100%; background: var(--accent) }
.fit { font-family: var(--mono); font-size: 0.8rem; padding: 2px 6px; border-radius: 4px; display: inline-block; min-width: 44px; text-align: right }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0 }
.card h3 { margin: 0; font-size: 1rem }
.form { display: grid; grid-template-columns: auto auto; gap: 8px 12px; align-items: center; justify-content: start }
.form label { color: var(--muted); font-size: 0.86rem }

&lt;section class=&quot;panel&quot; id=&quot;tab-gepa&quot; hidden&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;핵심&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;
    &lt;li&gt;GEPA를 직접 잇는 데이터 생성 APO(FORGE, SIPDO, IPC, CASPER)는 모두 &lt;b&gt;누적형&lt;/b&gt;입니다. FORGE는 이렇게 명시합니다.
      &lt;blockquote&gt;&quot;append-only: existing training instances are neither removed nor modified&quot;&lt;/blockquote&gt;&lt;/li&gt;
    &lt;li&gt;프롬프트·ICL 쪽에서 실제로 교체하는 것은 &lt;b&gt;BRIDGE&lt;/b&gt;(예시 풀 재생성), &lt;b&gt;Self-Generated ICL for agents&lt;/b&gt;(예시 DB 교체), &lt;b&gt;PIAST&lt;/b&gt;(Shapley 값으로 few-shot 예시를 교체·삭제·유지)입니다. 스킬 라이브러리를 은퇴·변이로 갈아 끼우는 &lt;b&gt;SkillForge&lt;/b&gt;도 컨텍스트 교체에 가깝지만 주 기여는 가중치 학습입니다.&lt;/li&gt;
    &lt;li id=&quot;g1note&quot;&gt;&lt;/li&gt;
    &lt;li&gt;교체 메커니즘은 대부분 가중치 학습(C) 쪽에 있습니다. 이를 GEPA의 학습 셋(D_train) 관리에 옮기는 것은 아직 비어 있는 자리로 보입니다.&lt;/li&gt;
    &lt;li&gt;원본을 전부 생성 데이터로 반복 교체하면 model collapse 위험이 있습니다(R 폴더: How Bad is Training on Synthetic Data?, Strong Model Collapse, What Matters in LLM-generated Data). 원본 일부를 anchor로 남기고 Pareto(validation) 셋은 교체하지 않는 설계를 함께 검토할 만합니다.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;모델 구성으로 본 차이&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;
    &lt;li&gt;&lt;b&gt;별도의 최적화·반성 모델&lt;/b&gt;(GEPA처럼 프롬프트 대상 모델과 반성 모델을 분리)을 쓰는 것은 3군의 FORGE(Qwen3.5-35B-A3B 프롬프트 대상 + GPT-5.5 반성·생성·검증), FinQA(GPT-4.1이 워크플로 전체), Data-Prompt Co-Evolution(Gemini 2.5 Flash)뿐입니다. SIPDO는 한 모델이 생성·수정·수행을 모두 맡습니다.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;1군(루프 내 교체)에서 별도의 최적화 모델은 데이터 쪽에만 있습니다&lt;/b&gt;: AutoSFT(GPT-5.5 agent가 데이터 행동 결정), ADE(Qwen2.5-72B agent가 관찰·변이·선택). 프롬프트 쪽 PIAST는 한 모델(Qwen2.5-7B)이 예시 생성·개선·평가를 모두 맡습니다. 나머지 교체용 데이터는 (a) 학습 대상·프롬프트 대상 모델 &lt;b&gt;자신&lt;/b&gt;이 만들거나(BRIDGE, Think-Prune-Train, ExIt, EvoEnv, D²Evo, Seirênes) (b) 더 강한 &lt;b&gt;교사&lt;/b&gt;가 만듭니다(eva: Gemini-1.5-pro, QbQ: GPT-5-mini, ATGen: GPT-4o-mini, SeDi: ChatGPT, Middo: GPT-4o-mini, SEELE: DeepSeek-V3).&lt;/li&gt;
    &lt;li&gt;GEPA(예: Qwen3-8B 프롬프트 대상 모델 + 반성 모델)에 교체형을 넣는다면, 교체 데이터를 &lt;b&gt;반성 모델이 만들지&lt;/b&gt;(FORGE식) &lt;b&gt;프롬프트 대상 모델이 스스로 만들지&lt;/b&gt;(BRIDGE식)가 첫 설계 선택지입니다.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;교체형 × 기존 문제 변형형&lt;/h3&gt;&lt;p id=&quot;varNote&quot;&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;교체 메커니즘 → GEPA 적용 아이디어&lt;/h3&gt;
    &lt;p class=&quot;note&quot;&gt;오른쪽 열은 논문 내용이 아니라 GEPA에 옮겨 볼 수 있는 방향을 제안한 것입니다.&lt;/p&gt;
    &lt;div class=&quot;tablebox&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;메커니즘&lt;/th&gt;&lt;th&gt;출처 논문&lt;/th&gt;&lt;th&gt;GEPA에 옮긴다면&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;효용 추정 후 교체·삭제·유지&lt;/b&gt;&lt;/td&gt;&lt;td&gt;PIAST&lt;/td&gt;&lt;td&gt;few-shot 예시(또는 D_train 예제)마다 Shapley류 효용을 추정해 가장 덜 유용한 것을 새 후보로 교체하거나 버린다.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;정제본으로 교체 + 스냅샷 선택&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Middo, ADE&lt;/td&gt;&lt;td&gt;실패·저품질 예제를 다듬은 버전으로 바꾸되, 이전 스냅샷보다 나을 때만 받아들여(steady-state admission) 퇴행을 막는다.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;예시 풀 재생성·교체&lt;/b&gt;&lt;/td&gt;&lt;td&gt;BRIDGE&lt;/td&gt;&lt;td&gt;라운드마다 현재 최선 후보로 D_train을 다시 풀고, 결과(맞힘·틀림·새 rationale)로 피드백 예제 풀을 다시 만든다.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;고정 크기 전부 교체&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Think-Prune-Train&lt;/td&gt;&lt;td&gt;D_train 크기를 고정해 라운드당 rollout 비용을 일정하게 유지하고, 누적 효과와 교체 효과를 분리해 비교한다.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;최저 점수 축출 버퍼&lt;/b&gt;&lt;/td&gt;&lt;td&gt;ExIt&lt;/td&gt;&lt;td&gt;예제별 정보량(후보 간 점수 분산 등)을 점수로 삼아, 새로 생성한 예제가 최저 점수 예제를 밀어내게 한다.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;포화 시 퇴역&lt;/b&gt;&lt;/td&gt;&lt;td&gt;EvoEnv&lt;/td&gt;&lt;td&gt;모든 Pareto 후보가 맞히는 예제는 퇴역시키고 변형의 seed로만 재사용한다(APEX의 Easy tier와 같은 관점).&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;우선순위 버퍼 + 원본 혼합&lt;/b&gt;&lt;/td&gt;&lt;td&gt;eva, D²Evo&lt;/td&gt;&lt;td&gt;원본 일부를 anchor로 남겨 생성 데이터만으로 분포가 흘러가는 것(collapse)을 막는다.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;잘 푸는 문제를 seed로 변형&lt;/b&gt;&lt;/td&gt;&lt;td&gt;QbQ&lt;/td&gt;&lt;td&gt;대부분 맞힌 예제를 변형해 난이도를 한 단계 올린 예제로 교체한다. 못 푸는 예제를 seed로 쓰는 FORGE와 대비된다.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;seed 축출&lt;/b&gt;&lt;/td&gt;&lt;td&gt;SeDi-Instruct&lt;/td&gt;&lt;td&gt;데이터 생성기의 seed 예시도 학습 효용 점수로 관리하고, 낮은 seed를 교체한다.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;집단 단위 DB 교체&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Self-Generated ICL (agents)&lt;/td&gt;&lt;td&gt;후보 집단마다 예제 풀을 따로 두고, 성과가 낮은 풀을 높은 풀의 복사본으로 바꾼다.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;panel&quot; id=&quot;tab-about&quot; hidden&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;정리 방법&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;
    &lt;li&gt;대상은 T1 카탈로그 529편(위쪽 전환 버튼의 &quot;데이터 생성 APO 카탈로그&quot;)입니다.&lt;/li&gt;
    &lt;li&gt;초록으로 1차 후보를 고른 뒤, PDF 본문(pdftotext)에서 replace·evict·refresh·retire·buffer·append 같은 표현을 찾았습니다. 찾은 문장의 앞뒤 문맥을 읽어 교체인지 누적인지 판정했습니다.&lt;/li&gt;
    &lt;li&gt;&quot;방식&quot; 열의 영어 인용문은 해당 논문 본문에서 가져온 짧은 구절입니다.&lt;/li&gt;
    &lt;li&gt;PDF 링크는 arXiv로 연결됩니다.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;모델 역할&lt;/b&gt;: 각 논문의 실험 설정을 본문에서 확인해, 모델마다 아래 역할 중 무엇을 맡는지 표시했습니다. 한 줄에 역할이 여러 개면 &lt;b&gt;같은 모델&lt;/b&gt;이 그 역할을 모두 맡는다는 뜻입니다.&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;rl rT&quot;&gt;학습 대상&lt;/span&gt; 가중치를 갱신하는 모델 (SFT·RL·증류·LoRA)&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;rl rX&quot;&gt;프롬프트 대상&lt;/span&gt; 가중치 고정. 최적화 중인 프롬프트·컨텍스트를 넣어 rollout(학습·검증 셋 풀이)과 최종 테스트 추론을 하는 모델. 그 점수가 최적화 신호가 됨 (GEPA의 task model)&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;rl rO&quot;&gt;최적화·반성&lt;/span&gt; 실패를 분석하고 프롬프트·컨텍스트 수정을 제안하는 모델 (GEPA의 reflection LM에 해당)&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;rl rG&quot;&gt;데이터 생성&lt;/span&gt; 문제·예시·응답·rationale을 만드는 모델 (교사 포함)&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;rl rJ&quot;&gt;판정·보상&lt;/span&gt; 채점·검증·보상을 매기는 모델&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;rl rA&quot;&gt;보조&lt;/span&gt; 임베딩·검색·다양성 측정 등&lt;/li&gt;&lt;/ul&gt;본문에 모델명이 없으면 &quot;확인 못 함&quot;으로 적었습니다. 하류 평가용 baseline 모델은 넣지 않았습니다.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;연구 유형 태그&lt;/b&gt;: 각 논문이 실제로 무엇을 바꾸는지로 붙였습니다(T1 카탈로그와 같은 기준).&lt;ul&gt;&lt;li&gt;&lt;b&gt;APO&lt;/b&gt;: 프롬프트(지시문·soft prompt)를 최적화&lt;/li&gt;&lt;li&gt;&lt;b&gt;Context Eng.&lt;/b&gt;: 시연·예시·메모리·스킬·harness 등 프롬프트에 들어가는 컨텍스트를 생성·선택·최적화 (가중치 고정)&lt;/li&gt;&lt;li&gt;&lt;b&gt;가중치 학습&lt;/b&gt;: 생성 데이터로 SFT·RL·증류를 해서 모델 파라미터를 갱신&lt;/li&gt;&lt;li&gt;&lt;b&gt;학습 데이터 생성&lt;/b&gt;: 학습용 데이터셋·환경을 만드는 파이프라인이 주 기여&lt;/li&gt;&lt;li&gt;&lt;b&gt;평가·레드팀&lt;/b&gt;: 평가 문항·벤치마크·레드팀 테스트를 생성&lt;/li&gt;&lt;li&gt;&lt;b&gt;분석·서베이&lt;/b&gt;: 이론·실증 분석, 서베이&lt;/li&gt;&lt;/ul&gt;&quot;생성기용&quot;은 APO·CE를 과제 모델이 아니라 데이터 생성기에 적용했다는 뜻입니다.&lt;/li&gt;
    &lt;li&gt;PromptWizard는 합성 예시로 ICL 예시를 바꾸는 것으로 보이지만, 교체인지 추가인지 본문에서 확인하지 못해 제외했습니다.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/section&gt;

<script>
(function(){
  const root = document.documentElement, frames = [...document.querySelectorAll(".views iframe")];
  const theme = () => root.getAttribute("data-theme") || "auto";
  function applyTheme(){
    frames.forEach(f => { try { const d = f.contentDocument && f.contentDocument.documentElement; if (!d) return;
      theme() === "auto" ? d.removeAttribute("data-theme") : d.setAttribute("data-theme", theme()) } catch (e) {} });
    document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeSet === theme()));
  }
  document.querySelectorAll("[data-theme-set]").forEach(b => b.addEventListener("click", () => {
    const v = b.dataset.themeSet; v === "auto" ? root.removeAttribute("data-theme") : root.setAttribute("data-theme", v);
    try { v === "auto" ? localStorage.removeItem("t1-theme") : localStorage.setItem("t1-theme", v) } catch (e) {}
    applyTheme();
  }));
  function show(v){
    if (v !== "replace") v = "catalog";
    frames.forEach(f => f.hidden = f.id !== "v-" + v);
    document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-selected", b.dataset.view === v));
    if (location.hash.slice(1) !== v) history.replaceState(null, "", "#" + v);
  }
  document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => show(b.dataset.view)));
  frames.forEach(f => f.addEventListener("load", () => {
    applyTheme();
    if (f.id === "v-catalog") try {  // "교체형 n군" badges in the catalog jump to the other view
      const d = f.contentDocument, st = d.createElement("style"); st.textContent = ".rp{cursor:pointer}"; d.head.appendChild(st);
      d.addEventListener("click", e => { if (e.target.closest(".rp")) show("replace") });
    } catch (e) {}
  }));
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1)); applyTheme();
})();
</script>
